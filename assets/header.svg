<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="Gustavo Ferreira Cabral, full stack developer building data pipelines and AI agents" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .card { fill:#0d1117; stroke:#30363d; }
    .name, .lbl { fill:#e6edf3; }
    .role, .prompt { fill:#7d8590; }
    .rail { stroke:#30363d; stroke-width:2; stroke-dasharray:4 6; }
    .node { fill:#161b22; stroke-width:1.5; }
    .n-src { stroke:#7d8590; } .n-out { stroke:#e6edf3; }
    @media (prefers-color-scheme: light) {
      .card { fill:#ffffff; stroke:#d0d7de; }
      .name, .lbl { fill:#1f2328; }
      .role, .prompt { fill:#656d76; }
      .rail { stroke:#d0d7de; }
      .node { fill:#f6f8fa; }
      .n-src { stroke:#656d76; } .n-out { stroke:#1f2328; }
    }
    .n-b { stroke:#b87333; } .n-s { stroke:#a8b2bd; } .n-g { stroke:#e3b341; }
    .lbl.b { fill:#b87333; } .lbl.s { fill:#8c96a1; } .lbl.g { fill:#d4a02a; }
    .sans { font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
    .name { font-size:32px; font-weight:700; letter-spacing:-0.5px; }
    .role { font-size:17px; }
    .prompt { font-size:15px; }
    .lbl { font-size:13px; text-anchor:middle; }
    .pkt { fill:#e3b341; }
    .in { opacity:0; animation:in .7s ease-out forwards; }
    .d1 { animation-delay:.9s; } .d2 { animation-delay:1.3s; } .d3 { animation-delay:1.9s; }
    @keyframes in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { .in { animation:none; opacity:1; } .pkt { display:none; } }
  </style>

  <rect class="card" x="1" y="1" width="818" height="258" rx="14"/>

  <clipPath id="typing">
    <rect x="44" y="40" height="30" width="0">
      <animate attributeName="width" values="0;20;40;60;80;100;120;150" dur=".6s" begin=".2s" fill="freeze" calcMode="discrete"/>
    </rect>
  </clipPath>
  <text class="mono prompt" x="44" y="60" clip-path="url(#typing)">$ whoami</text>

  <text class="sans name in d1" x="44" y="104">Gustavo Ferreira Cabral</text>
  <text class="sans role in d2" x="44" y="134">Full stack developer building data pipelines and AI agents</text>

  <g class="in d3">
    <line class="rail" x1="104" y1="202" x2="716" y2="202"/>
    <g class="pkt">
      <circle r="4" cy="202" cx="104"><animate attributeName="cx" values="104;716" dur="3.2s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle r="4" cy="202" cx="104"><animate attributeName="cx" values="104;716" dur="3.2s" begin="3.47s" repeatCount="indefinite"/></circle>
      <circle r="4" cy="202" cx="104"><animate attributeName="cx" values="104;716" dur="3.2s" begin="4.54s" repeatCount="indefinite"/></circle>
    </g>
    <rect class="node n-src" x="44"  y="184" width="120" height="36" rx="18"/>
    <rect class="node n-b"   x="197" y="184" width="120" height="36" rx="8"/>
    <rect class="node n-s"   x="350" y="184" width="120" height="36" rx="8"/>
    <rect class="node n-g"   x="503" y="184" width="120" height="36" rx="8"/>
    <rect class="node n-out" x="656" y="184" width="120" height="36" rx="18"/>
    <text class="mono lbl"   x="104" y="207">kafka / cdc</text>
    <text class="mono lbl b" x="257" y="207">bronze</text>
    <text class="mono lbl s" x="410" y="207">silver</text>
    <text class="mono lbl g" x="563" y="207">gold</text>
    <text class="mono lbl"   x="716" y="207">apis / agents</text>
  </g>
</svg>
